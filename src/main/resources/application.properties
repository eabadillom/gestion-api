gestion-api.duracionToken=1
spring.application.name=gestion-api
spring.datasource.jndi-name=java:comp/env/jdbc/gestion
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.time-zone=GMT-6
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
logging.level.org.springframework.web=info
logging.level.org.hibernate=info
logging.config=classpath:log4j2.xml
jwt.accessExpiration=604800000 
jwt.refreshExpiration=2592000000
